<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b19" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e113a" />
    </linearGradient>

    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="accent-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.7" />
    </linearGradient>

    <!-- Filters for Glow -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.65; transform: scale(1.08); }
    }
    @keyframes floatSlow1 {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(0.5deg); }
    }
    @keyframes floatSlow2 {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(8px) rotate(-0.5deg); }
    }
    @keyframes dashStream {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes pingDot {
      0% { r: 4; opacity: 1; }
      75%, 100% { r: 12; opacity: 0; }
    }
    @keyframes soundWave {
      0%, 100% { height: 8px; y: 16px; }
      50% { height: 28px; y: 6px; }
    }

    .bg-orb-1 {
      animation: pulseGlow 7s ease-in-out infinite;
      transform-origin: 200px 100px;
    }
    .bg-orb-2 {
      animation: pulseGlow 9s ease-in-out infinite reverse;
      transform-origin: 1000px 320px;
    }
    .flow-line {
      stroke-dasharray: 8 6;
      animation: dashStream 14s linear infinite;
    }
    .flow-line-rev {
      stroke-dasharray: 6 6;
      animation: dashStream 10s linear infinite reverse;
    }
    .ping-circle {
      animation: pingDot 2s cubic-bezier(0, 0, 0.2, 1) infinite;
    }
    .card-float-1 {
      animation: floatSlow1 6s ease-in-out infinite;
    }
    .card-float-2 {
      animation: floatSlow2 7s ease-in-out infinite;
    }
    .card-float-3 {
      animation: floatSlow1 8s ease-in-out infinite;
    }
    .wave-bar-1 { animation: soundWave 1.1s ease-in-out infinite; }
    .wave-bar-2 { animation: soundWave 0.8s ease-in-out infinite 0.2s; }
    .wave-bar-3 { animation: soundWave 1.4s ease-in-out infinite 0.4s; }
    .wave-bar-4 { animation: soundWave 0.9s ease-in-out infinite 0.1s; }
    .wave-bar-5 { animation: soundWave 1.2s ease-in-out infinite 0.3s; }
  </style>

  <!-- Base Canvas -->
  <rect width="1200" height="420" rx="16" fill="url(#bg-grad)" />

  <!-- Grid Pattern Overlay -->
  <g opacity="0.12">
    <path d="M0 60 H1200 M0 120 H1200 M0 180 H1200 M0 240 H1200 M0 300 H1200 M0 360 H1200" stroke="#94a3b8" stroke-width="1" />
    <path d="M120 0 V420 M240 0 V420 M360 0 V420 M480 0 V420 M600 0 V420 M720 0 V420 M840 0 V420 M960 0 V420 M1080 0 V420" stroke="#94a3b8" stroke-width="1" />
  </g>

  <!-- Ambient Dynamic Glowing Orbs (in Background) -->
  <circle class="bg-orb-1" cx="220" cy="120" r="160" fill="url(#accent-cyan)" filter="url(#glow-cyan)" />
  <circle class="bg-orb-2" cx="980" cy="300" r="180" fill="url(#accent-purple)" filter="url(#glow-purple)" />

  <!-- Dynamic Connection Flow Streams (Layered behind text) -->
  <g opacity="0.35">
    <path class="flow-line" d="M -50 180 Q 250 80, 600 190 T 1250 150" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path class="flow-line-rev" d="M -50 260 Q 350 340, 700 230 T 1250 280" fill="none" stroke="#c084fc" stroke-width="2" />
  </g>

  <!-- Floating Dynamic Decorative Card: Left (Voice / Audio Stream) -->
  <g class="card-float-1" transform="translate(45, 115)" filter="url(#card-shadow)">
    <rect width="170" height="74" rx="12" fill="url(#card-grad)" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5" />
    <circle cx="24" cy="24" r="8" fill="#0284c7" />
    <circle cx="24" cy="24" r="4" fill="#38bdf8" />
    <circle class="ping-circle" cx="24" cy="24" r="4" stroke="#38bdf8" stroke-width="1.5" fill="none" />
    <text x="40" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="1">VOICE PIPELINE</text>
    <text x="24" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">STT &#x2192; MT &#x2192; TTS</text>
    <!-- Mini sound wave visualizer -->
    <g transform="translate(115, 36)" fill="#38bdf8" opacity="0.9">
      <rect class="wave-bar-1" x="0" width="3" rx="1.5" />
      <rect class="wave-bar-2" x="6" width="3" rx="1.5" />
      <rect class="wave-bar-3" x="12" width="3" rx="1.5" />
      <rect class="wave-bar-4" x="18" width="3" rx="1.5" />
      <rect class="wave-bar-5" x="24" width="3" rx="1.5" />
    </g>
  </g>

  <!-- Floating Dynamic Decorative Card: Right (LangOps Routing) -->
  <g class="card-float-2" transform="translate(980, 115)" filter="url(#card-shadow)">
    <rect width="175" height="74" rx="12" fill="url(#card-grad)" stroke="#a855f7" stroke-opacity="0.4" stroke-width="1.5" />
    <circle cx="24" cy="24" r="8" fill="#7e22ce" />
    <circle cx="24" cy="24" r="4" fill="#c084fc" />
    <circle class="ping-circle" cx="24" cy="24" r="4" stroke="#c084fc" stroke-width="1.5" fill="none" />
    <text x="40" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#c084fc" letter-spacing="1">AGENTIC ROUTING</text>
    <text x="24" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">&lt; 1000ms Latency</text>
    <path d="M 125 48 L 138 48 L 146 40 M 138 48 L 146 56" stroke="#c084fc" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Foreground Main Branding & Typography (Clear & Unobscured) -->
  <g id="foreground-content" transform="translate(600, 145)" text-anchor="middle">
    <!-- Top Super-Badge / Category Pill -->
    <g transform="translate(0, -68)">
      <rect x="-165" y="-14" width="330" height="28" rx="14" fill="#1e293b" fill-opacity="0.95" stroke="#475569" stroke-width="1" />
      <circle cx="-145" cy="0" r="4" fill="#10b981" />
      <circle class="ping-circle" cx="-145" cy="0" r="4" stroke="#10b981" stroke-width="1.5" fill="none" />
      <text x="5" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#e2e8f0" letter-spacing="1.5">
        TOP ECOSYSTEM &amp; BENCHMARKS
      </text>
    </g>

    <!-- Main Title (Gradient Fill + Subtle Drop Shadow) -->
    <text y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif" font-size="37" font-weight="900" fill="url(#primary-grad)" letter-spacing="-0.5">
      REAL-TIME MULTILINGUAL SUPPORT
    </text>
    <text y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif" font-size="28" font-weight="800" fill="#f8fafc" letter-spacing="0.2">
      ORCHESTRATION ARCHITECTURE
    </text>

    <!-- Subtitle / Tagline -->
    <text y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="500" fill="#94a3b8" letter-spacing="0.3">
      Curated Landscape of SaaS Platforms, Self-Hosted Open-Source Stacks &amp; LangOps Frameworks
    </text>
  </g>

  <!-- Bottom Interactive Capability Badges / Metrics Row -->
  <g class="card-float-3" transform="translate(160, 310)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="155" height="38" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1"/>
      <text x="77" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">&#x1F4AC; Live Chat MT</text>
    </g>

    <!-- Pill 2 -->
    <g transform="translate(180, 0)">
      <rect width="165" height="38" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#818cf8" stroke-opacity="0.3" stroke-width="1"/>
      <text x="82" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">&#x1F399;&#xFE0F; Speech-to-Speech</text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(365, 0)">
      <rect width="165" height="38" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#c084fc" stroke-opacity="0.3" stroke-width="1"/>
      <text x="82" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">&#x1F6E1;&#xFE0F; Brand Glossaries</text>
    </g>

    <!-- Pill 4 -->
    <g transform="translate(550, 0)">
      <rect width="165" height="38" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#34d399" stroke-opacity="0.3" stroke-width="1"/>
      <text x="82" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">&#x26A1; CRM Integrations</text>
    </g>

    <!-- Pill 5 -->
    <g transform="translate(735, 0)">
      <rect width="145" height="38" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#f43f5e" stroke-opacity="0.3" stroke-width="1"/>
      <text x="72" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">&#x1F512; Self-Hosted MT</text>
    </g>
  </g>
</svg>
